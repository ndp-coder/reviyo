<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e2250" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/brand/reviyo-icon-48.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/brand/reviyo-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/reviyo-icon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <!-- seo:start -->
    <!-- Replaced per page at build time by scripts/prerender.mjs (from src/config/seo.ts)
         and kept up to date on navigation by <RouteMeta />. These defaults only apply
         in local development. -->
    <title>Reviyo: Get More Google Reviews with a QR Code &amp; AI</title>
    <meta name="description" content="Reviyo helps local businesses in India get more genuine Google reviews with a QR code and AI-assisted review writing." />
    <!-- seo:end -->
    <!--
      No analytics, advertising, or tracking tags belong in this file. Reviyo's
      published Cookie Policy states that the site sets no non-essential storage
      and therefore shows no consent banner; adding a tag here would make that
      page false and would require a real banner with a working reject option.
      The only third-party script is the Razorpay checkout, and it is loaded on
      demand from src/lib/razorpay.ts when a signed-in owner starts a payment.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
